[package]
name = "flash"
version = "1.0.0"
edition = "2024"
description = "Flash: Windows driver updater and PC health tool"
repository = "https://github.com/ljcatherine/Flash"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
sysinfo = "0.33"
ureq = "2"

# The bin embeds a requireAdministrator manifest, so its (empty) test harness can't start unelevated.
[[bin]]
name = "flash"
path = "src/main.rs"
test = false

[build-dependencies]
winresource = "0.1"
